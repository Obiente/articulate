name: Windows

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust tools
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Format, tests and Clippy
        shell: pwsh
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed.' }
          $env:PATH = (Join-Path $PWD '.local/native/install/bin') + ';' + $env:PATH
          ./scripts/build-windows.ps1 -Test
          cargo clippy --release --locked --features dynamic-backends --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed.' }
      - name: Package without speech models
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Upload test artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Articulate-windows-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
