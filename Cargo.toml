[package]
name = "articulate"
default-run = "articulate"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
description = "Your words, ready to use. Local dictation and call transcripts."
license = "AGPL-3.0-or-later"
repository = "https://github.com/Obiente/articulate"
homepage = "https://github.com/Obiente/articulate"

[features]
default = []
dynamic-backends = ["transcribe-cpp/dynamic-backends"]
vulkan = ["transcribe-cpp/vulkan"]

[build-dependencies]
tauri-build = "2"
serde_json = "1"
sha2 = "0.10"

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
assort-core = { git = "https://github.com/Obiente/assort.git", rev = "d6cf161ac6db63ba221cfef6e9d7975d09f38d6d" }
assort-data = { git = "https://github.com/Obiente/assort.git", rev = "d6cf161ac6db63ba221cfef6e9d7975d09f38d6d" }
assort-inference = { git = "https://github.com/Obiente/assort.git", rev = "d6cf161ac6db63ba221cfef6e9d7975d09f38d6d" }
assort-model = { git = "https://github.com/Obiente/assort.git", rev = "d6cf161ac6db63ba221cfef6e9d7975d09f38d6d" }
assort-tokenizer = { git = "https://github.com/Obiente/assort.git", rev = "d6cf161ac6db63ba221cfef6e9d7975d09f38d6d" }
assort-transcript = { git = "https://github.com/Obiente/assort.git", rev = "d6cf161ac6db63ba221cfef6e9d7975d09f38d6d" }
burn = { version = "=0.21.0", default-features = false, features = ["std", "flex"] }
anyhow = "1"
cpal = "0.16"
image = { version = "0.25", default-features = false, features = ["png"] }
hound = "3.5"
ringbuf = "0.4"
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
time = { version = "0.3", features = ["local-offset"] }
sha2 = "0.10"
transcribe-cpp = { version = "=0.2.3", default-features = false }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
zip = { version = "=7.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
earshot = "=1.2.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_Security"] }

[target.'cfg(windows)'.dev-dependencies]
winit = { version = "0.30", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
opt-level = 1
# Full type debug information from the model backend exceeds MSVC's PDB limit.
# Keep source/line information while making development and test links reliable.
debug = 1
